<!DOCTYPE html>
<html>
<head>
    <title>Analysis Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Analysis Results</h1>
    <table>
        <tr>
            <th>SampleID</th>
            <th>Prediction</th>
            <th>Probability</th>
        </tr>
        {% for row in results %}
        <tr>
            <td>
                {% if row['Prediction']=='Tumor' %}
                <a href="{{ url_for('view_sample', filename=filename, sample_id=row['SampleID']) }}">{{ row['SampleID'] }}</a>
                {% else %}
                {{ row['SampleID'] }}
                {% endif %}
            </td>
            <td>{{ row['Prediction'] }}</td>
            <td>{{ "%.3f"|format(row['Probability']) }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="{{ url_for('index') }}"><button>Upload another file</button></a>
</div>
</body>
</html>
